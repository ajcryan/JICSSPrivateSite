<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whitepapers - JICSS Members</title>
  <link rel="icon" type="image/png" href="https://storage.googleapis.com/production-os-assets/assets/5753ed04-b465-4756-bca3-aaa6ad16bcf3">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/common.css">
  <!-- Load common.js early so Memberstack loads ASAP -->
  <script src="/assets/common.js"></script>
  <style>
    body {
      font-family: 'Lato', sans-serif;
      color: #333;
      background: #ffffff;
    }
    
    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 40px 80px;
    }
    
    h1 {
      color: #222;
      font-size: 2.5em;
      font-weight: 700;
      margin-bottom: 40px;
    }
    
    .whitepaper-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .whitepaper-item {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 25px;
      transition: all 0.3s;
    }
    
    .whitepaper-item:hover {
      border-color: #007cff;
      box-shadow: 0 4px 12px rgba(0, 124, 255, 0.1);
    }
    
    .whitepaper-item h3 {
      color: #222;
      font-size: 1.3em;
      margin-bottom: 10px;
    }
    
    .whitepaper-item p {
      color: #666;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    
    .whitepaper-item a {
      display: inline-block;
      padding: 10px 20px;
      background: #007cff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
    }
    
    .whitepaper-item a:hover {
      background: #0066cc;
      transform: translateY(-2px);
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 0 20px 60px;
        margin: 40px auto;
      }
      
      h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container">
    <h1>Member Whitepapers</h1>
    
    <div class="whitepaper-list">
      <div class="whitepaper-item">
        <h3>Cybersecurity Strategy 2024</h3>
        <p>Comprehensive analysis of Japan's cybersecurity landscape and strategic recommendations.</p>
        <a href="view-pdf.html?pdf=documents/EU Cyber Resilience Act (CRA) Compliance Services-EN.pdf&title=Recommendations 2025">
          View Whitepaper
        </a>
      </div>
      
      <div class="whitepaper-item">
        <h3>Annual Research Report</h3>
        <p>Key findings from our annual research initiatives and policy recommendations.</p>
        <a href="view-pdf.html?pdf=documents/Japan Secure Technologies (JST) Business Plan (Condensed).pdf&title=JST_Business Plan Report">
          View Report
        </a>
      </div>

      <!-- Add more whitepapers here -->
    </div>
  </div>

  <div id="footer-placeholder"></div>



</body>
</html>
