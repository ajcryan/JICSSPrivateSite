<!DOCTYPE html>
<html>
<head>
  <title>Test Cloud Function</title>
</head>
<body>
  <h1>Test getProtectedPdfUrl Function</h1>
  <button id="testBtn">Test Function Call</button>
  <pre id="output"></pre>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

  <script>
    const output = document.getElementById('output');

    function log(message, isError = false) {
      const line = document.createElement('div');
      line.textContent = message;
      line.style.color = isError ? 'red' : 'black';
      output.appendChild(line);
      console.log(message);
    }

    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB0UYL3dbJEOGVTP3e5QqcGATOUn0nsGS0",
      authDomain: "jicssprivatesite.firebaseapp.com",
      projectId: "jicssprivatesite",
      storageBucket: "jicssprivatesite.firebasestorage.app"
    };

    firebase.initializeApp(firebaseConfig);
    const functions = firebase.functions();
    const auth = firebase.auth();

    // Connect to emulators
    log('Connecting to emulators...');
    functions.useEmulator('localhost', 5001);
    auth.useEmulator('http://localhost:9099');
    log('✓ Connected to emulators');

    document.getElementById('testBtn').addEventListener('click', async () => {
      output.innerHTML = '';
      log('Starting test...');

      try {
        // Step 1: Sign in anonymously
        log('1. Signing in to Firebase Auth...');
        let user = auth.currentUser;
        if (!user) {
          const credential = await auth.signInAnonymously();
          user = credential.user;
          log(`✓ Signed in with UID: ${user.uid}`);
        } else {
          log(`✓ Already signed in with UID: ${user.uid}`);
        }

        // Step 2: Call the function
        log('2. Calling getProtectedPdfUrl function...');
        const getProtectedPdfUrl = functions.httpsCallable('getProtectedPdfUrl');

        log('   Calling with pdfPath: whitepapers/test-document.pdf');
        const result = await getProtectedPdfUrl({ pdfPath: 'whitepapers/test-document.pdf' });

        log('✓ Function call successful!');
        log('Response: ' + JSON.stringify(result.data, null, 2));

        if (result.data.url) {
          log('\nSigned URL: ' + result.data.url.substring(0, 100) + '...');
        }

      } catch (error) {
        log('✗ Error:', true);
        log('Error code: ' + error.code, true);
        log('Error message: ' + error.message, true);
        log('Full error: ' + JSON.stringify(error, null, 2), true);
        console.error('Full error object:', error);
      }
    });
  </script>
</body>
</html>
